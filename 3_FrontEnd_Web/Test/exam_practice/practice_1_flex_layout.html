<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>考试实战 1：Flex 布局与导航栏卡片</title>
    <style>
        /* ==========================================
           【考试要求】
           1. 全局清除默认内外边距，使用 border-box。
           2. 顶部导航栏（Header）高度 70px，背景色 #333，文字白色。
              - 使用 Flex 布局，使 Logo 居左，Nav 导航项居右。
              - 导航项水平排列，项与项之间有 20px 间距，鼠标悬停时文字变黄色。
           3. 主体区域（Content）居中分布，包含 3 个卡片（Card）呈水平三列布局。
              - 使用 Flex 布局，且卡片等宽，间距 20px。
              - 每个卡片有 1px 灰色边框，10px 内边距，5px 圆角，鼠标悬浮时有阴影并轻微上移。
           4. 页脚（Footer）高度 50px，背景色 #222，文字水平垂直居中。
           ========================================== */

        /* ------ 以下为参考答案样式 ------ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", sans-serif;
            background-color: #f5f7fa;
            color: #333;
        }

        /* 顶部导航栏 */
        header {
            height: 70px;
            background-color: #1a1a1a;
            color: #fff;
            padding: 0 40px;
            /* Flex 布局实现两端对齐 */
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        nav ul {
            display: flex;
            list-style: none;
        }

        nav ul li {
            margin-left: 25px;
        }

        nav ul li a {
            color: #ccc;
            text-decoration: none;
            font-size: 16px;
            transition: color 0.3s;
        }

        nav ul li a:hover {
            color: #ffcc00; /* 鼠标悬停变黄色 */
        }

        /* 主体内容区 */
        .container {
            max-width: 1200px;
            margin: 40px auto; /* 上下 40px，水平居中 */
            padding: 0 20px;
        }

        .card-group {
            /* Flex 布局实现三列排版 */
            display: flex;
            justify-content: space-between;
            gap: 20px; /* 间距 */
        }

        .card {
            flex: 1; /* 三个卡片均分宽度 */
            background-color: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            transition: all 0.3s ease; /* 平滑过渡效果 */
        }

        /* 鼠标悬停卡片效果：浮起 + 阴影 */
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            border-color: #007bff;
        }

        .card h3 {
            margin-bottom: 12px;
            color: #007bff;
        }

        .card p {
            font-size: 14px;
            line-height: 1.6;
            color: #666;
        }

        /* 页脚 */
        footer {
            height: 60px;
            background-color: #111;
            color: #888;
            font-size: 14px;
            /* Flex 布局实现完美垂直居中 */
            display: flex;
            justify-content: center;
            align-items: center;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>

    <!-- 顶部导航 -->
    <header>
        <div class="logo">WebExam</div>
        <nav>
            <ul>
                <li><a href="#">首页</a></li>
                <li><a href="#">课程</a></li>
                <li><a href="#">关于</a></li>
                <li><a href="#">联系我们</a></li>
            </ul>
        </nav>
    </header>

    <!-- 卡片区域 -->
    <div class="container">
        <div class="card-group">
            <div class="card">
                <h3>HTML 基础</h3>
                <p>HTML（超文本标记语言）是构建网页结构的核心。你需要牢记常用的语义化标签、表格结构以及表单控件的属性。</p>
            </div>
            <div class="card">
                <h3>CSS 样式</h3>
                <p>CSS 用于美化和排版。在考试中，Flexbox 布局和定位（relative/absolute）是必考的考点，一定要熟练掌握。</p>
            </div>
            <div class="card">
                <h3>JavaScript 交互</h3>
                <p>JS 赋予网页动态交互能力。通过 DOM 操纵元素、修改样式以及对用户事件进行响应是期末考试高频考查的内容。</p>
            </div>
        </div>
    </div>

    <!-- 页脚 -->
    <footer>
        <p>© 2026 网页设计期末考试复习版. 保留所有权利.</p>
    </footer>

</body>
</html>
