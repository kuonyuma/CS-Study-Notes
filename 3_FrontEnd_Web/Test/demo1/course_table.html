<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>我的课程表 - 盒子模型与定位实战</title>
    <style>

        body {
            margin: 0;
            padding: 0;
            background-color: #0c083a; /* 深蓝色背景 */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* ========================================================
           2. 容器【1】盒子模型设计 (主卡片)
           ======================================================== */
        .course-card {
            position: relative;
            z-index: 10;
            width: 330px; /* 盒子宽度 */
            background-color: #ffffff; /* 白色底色 */
            border-radius: 12px; /* 圆角 */
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4); /* 阴影 */
            padding: 16px; /* 内边距 (Padding) */
            box-sizing: border-box; /* 使用怪异盒模型，防止 padding 撑大盒子 */
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* ========================================================
           3. 头部【2】布局设计 (子绝父相的经典运用)
           ======================================================== */
        .card-header {
            position: relative; /* 🌟 父相：作为内部徽章绝对定位的基准线 */
            height: 46px;
            background: linear-gradient(90deg, #8bc6ec 0%, #9599e2 100%); /* 渐变蓝色背景 */
            border-radi: 6px;
            margin-bottom: 12px; /* 下外边距 (Margin-bottom) */
            text-align: center; /* 文字水平居中 */
            line-height: 46px; /* 行高与高度相同，实现单行文字垂直居中 */
        }

        .card-title {
            font-size: 18px;
            color: #ffffff;
            font-weight: bold;
            letter-spacing: 1px;
            margin: 0;
        }

        /* 徽章“2”：绝对定位在头部右侧 */
        .badge {
            position: absolute; /* 🌟 子绝：脱离标准流，在父盒子里任意定位 */
            right: 15px; /* 距离父盒子右边沿 15px */
            top: 50%; /* 距离父盒子顶部 50% */
            transform: translateY(-50%); /* 往上回移自身高度的一半，实现完美垂直居中 */

            width: 22px;
            height: 22px;
            background-color: #ffffff;
            border: 2px solid #ef4444; /* 红色边框 */
            color: #ef4444; /* 红色数字 */
            font-size: 12px;
            font-weight: bold;
            line-height: 18px; /* 微调文字行高以居中（减去2px边框） */
            text-align: center;
            border-radius: 4px;
            box-sizing: border-box;
        }

        /* ========================================================
           4. 列表【3】内容区盒子模型设计
           ======================================================== */
        .course-list {
            margin-bottom: 16px;
        }

        .course-item {
            padding: 14px 6px;
            border-bottom: 1px solid #f3f4f6; /* 用细线做分割线 */
        }

        /* 去除最后一个列表项的底边框分割线 */
        .course-item:last-child {
            border-bottom: none;
        }

        .item-title {
            font-size: 15px;
            color: #1f2937;
            font-weight: bold;
            margin: 0 0 6px 0;
        }

        /* 灰色字体的“继续学习” */
        .item-title span {
            color: #9ca3af;
            font-weight: normal;
            margin-right: 8px;
        }

        .item-status {
            font-size: 13px;
            color: #9ca3af;
            margin: 0;
        }

        /* ========================================================
           5. 底部按钮设计
           ======================================================== */
        .btn-all {
            display: block; /* 转为块级，使其撑满宽度 */
            width: 100%;
            height: 40px;
            line-height: 38px;
            text-align: center;
            border: 1.5px solid #008cff; /* 蓝色边框 */
            border-radius: 6px;
            color: #008cff; /* 蓝色文字 */
            font-size: 15px;
            font-weight: bold;
            text-decoration: none; /* 去除下划线 */
            box-sizing: border-box;
            transition: all 0.2s ease-in-out;
        }

        /* 鼠标悬停时的微交互效果 */
        .btn-all:hover {
            background-color: #008cff;
            color: #ffffff;
            box-shadow: 0 4px 10px rgba(0, 140, 255, 0.2);
        }
    </style>
</head>
<body>
<!-- 容器【1】：主卡片 -->
<div class="course-card">

    <!-- 头部【2】：带渐变背景的标题栏（父相） -->
    <div class="card-header">
        <h2 class="card-title">我的课程表</h2>
    </div>

    <!-- 列表【3】：课程记录列表 -->
    <div class="course-list">
        <div class="course-item">
            <h3 class="item-title"><span>继续学习</span>程序语言设计</h3>
            <p class="item-status">正在学习-使用对象</p>
        </div>

        <div class="course-item">
            <h3 class="item-title"><span>继续学习</span>程序语言设计</h3>
            <p class="item-status">正在学习-使用对象</p>
        </div>

        <div class="course-item">
            <h3 class="item-title"><span>继续学习</span>程序语言设计</h3>
            <p class="item-status">正在学习-使用对象</p>
        </div>
    </div>

    <!-- 底部按钮 -->
    <a class="btn-all" href="#">全部课程</a>

</div>

</body>
</html>
