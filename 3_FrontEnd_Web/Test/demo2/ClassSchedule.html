<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>classSchedule</title>
    <style>
        .main {
            position: relative;
            margin: 0 auto;
            top: 50px;
            width: 400px;
            height: 400px;
            border: 1px solid;
            border-radius: 10px;
            padding: 16px;
            box-sizing: border-box;
        }

        .head {
            background-color: aquamarine;
            text-align: center;
            border-radius: 6px;
        }

        .button {
            border: 1px solid;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="main">
    <div class="head">
        <h2>我的课程表</h2>
    </div>
    <div class="body">
        <div class="l1">
            <h3>继续学习html</h3>
            <p>继续学习form标签</p>
        </div>
        <hr>
        <div class="l2">
            <h3>继续学习css</h3>
            <p>继续盒子模型</p>
        </div>
        <hr>
        <div class="l3">
            <h3>继续学习javascript</h3>
            <p>继续学习fetch</p>
        </div>
        <div class="button">
            <input type="button" value="全部课程">
        </div>
    </div>
</div>
</body>
</html>
