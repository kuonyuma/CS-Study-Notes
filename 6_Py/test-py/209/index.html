<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>桜の谷 · 精细体素日式山谷</title>
  <style>
    :root {
      --primary-color: #ff9ebb;
      --accent-color: #e74c3c;
      --bg-glass: rgba(16, 20, 32, 0.78);
      --bg-glass-active: rgba(255, 158, 187, 0.28);
      --border-glass: rgba(255, 255, 255, 0.15);
      --text-main: #f5f6fa;
      --text-sub: #b2b8c8;
      --shadow-soft: 0 8px 32px 0 rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #10121d;
      font-family: -apple-system, BlinkMacSystemFont, "Yu Mincho", "Hiragino Mincho ProN", "Songti SC", "Noto Serif JP", serif;
      color: var(--text-main);
    }

    #webgl-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      display: block;
    }

    /* UI Overlay */
    .ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .ui-layer.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .interactive {
      pointer-events: auto;
    }

    /* Top Left Japanese Title Banner */
    .banner-title {
      position: absolute;
      top: 24px;
      left: 28px;
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      gap: 14px;
      background: var(--bg-glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 18px 16px;
      border-radius: 12px;
      border: 1px solid var(--border-glass);
      box-shadow: var(--shadow-soft);
      animation: fadeInDown 1.2s ease forwards;
    }

    .banner-title .seal {
      width: 26px;
      height: 26px;
      background: #c33a32;
      color: #fff;
      font-size: 14px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 2px 6px rgba(195, 58, 50, 0.4);
    }

    .banner-title .vertical-text {
      writing-mode: vertical-rl;
      text-orientation: upright;
      letter-spacing: 0.38em;
      font-size: 20px;
      font-weight: 600;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
    }

    .banner-title .subtitle-col {
      writing-mode: vertical-rl;
      font-size: 11px;
      letter-spacing: 0.3em;
      color: #e2b9c7;
      opacity: 0.9;
      border-right: 1px solid rgba(255, 255, 255, 0.2);
      padding-right: 8px;
      margin-right: 2px;
    }

    /* Bottom Control Bar */
    .bottom-bar-container {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: auto;
      max-width: 95vw;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: fadeInUp 1.2s ease forwards;
    }

    .control-dock {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-glass);
      border-radius: 40px;
      padding: 6px 14px;
      box-shadow: var(--shadow-soft);
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
    }

    .control-dock::-webkit-scrollbar {
      display: none;
    }

    .dock-group {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .dock-separator {
      width: 1px;
      height: 20px;
      background: rgba(255, 255, 255, 0.16);
      margin: 0 4px;
    }

    .btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-sub);
      font-family: inherit;
      font-size: 13px;
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
      outline: none;
    }

    .btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-1px);
    }

    .btn.active {
      color: #fff;
      background: var(--bg-glass-active);
      border-color: rgba(255, 158, 187, 0.45);
      font-weight: 500;
      box-shadow: 0 2px 10px rgba(255, 158, 187, 0.25);
    }

    .btn-icon {
      width: 32px;
      height: 32px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }

    .btn-icon svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    /* UI Toggle Button */
    .ui-show-trigger {
      position: absolute;
      bottom: 24px;
      right: 24px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--bg-glass);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-glass);
      color: var(--text-sub);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 100;
      box-shadow: var(--shadow-soft);
      transition: all 0.3s ease;
      opacity: 0.7;
    }

    .ui-show-trigger:hover {
      opacity: 1;
      transform: scale(1.08);
      color: #fff;
    }

    /* Loader */
    #loader {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #10121c;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    #loader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .sakura-spinner {
      width: 54px;
      height: 54px;
      position: relative;
      animation: rotateSakura 8s linear infinite;
    }

    .sakura-spinner svg {
      width: 100%;
      height: 100%;
      fill: #ff9ebb;
      filter: drop-shadow(0 0 10px rgba(255, 158, 187, 0.6));
    }

    .loader-title {
      margin-top: 24px;
      font-size: 18px;
      letter-spacing: 0.25em;
      color: #f7f8fc;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
    }

    .loader-sub {
      margin-top: 8px;
      font-size: 12px;
      letter-spacing: 0.15em;
      color: #8c92a6;
    }

    .loader-bar {
      width: 160px;
      height: 3px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      margin-top: 20px;
      overflow: hidden;
      position: relative;
    }

    .loader-bar-fill {
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, #ff9ebb, #e74c3c);
      border-radius: 2px;
      animation: barAnim 1.6s ease-in-out infinite;
    }

    @keyframes rotateSakura {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes barAnim {
      0% { transform: translateX(-100%); width: 20%; }
      50% { width: 60%; }
      100% { transform: translateX(200%); width: 20%; }
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translate(-50%, 16px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }

    .toast-msg {
      position: absolute;
      top: 24px;
      right: 28px;
      background: var(--bg-glass);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-glass);
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 12px;
      color: #e2b9c7;
      opacity: 0;
      transform: translateY(-8px);
      transition: all 0.3s ease;
      z-index: 100;
      pointer-events: none;
    }

    .toast-msg.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 768px) {
      .banner-title {
        top: 14px;
        left: 14px;
        padding: 10px 8px;
        gap: 6px;
      }
      .banner-title .seal {
        width: 22px;
        height: 22px;
        font-size: 12px;
      }
      .banner-title .vertical-text {
        font-size: 15px;
        letter-spacing: 0.22em;
      }
      .banner-title .subtitle-col {
        font-size: 9px;
        padding-right: 3px;
        letter-spacing: 0.2em;
      }
      .bottom-bar-container {
        bottom: 12px;
        width: 100%;
        max-width: 100vw;
        padding: 0 8px;
      }
      .control-dock {
        padding: 5px 8px;
        gap: 3px;
        width: 100%;
        justify-content: flex-start;
        touch-action: pan-x;
        -webkit-overflow-scrolling: touch;
      }
      .btn {
        font-size: 11px;
        padding: 5px 8px;
        flex-shrink: 0;
      }
      .btn-icon {
        width: 28px;
        height: 28px;
        flex-shrink: 0;
      }
    }
  </style>

  <!-- CDNs for Three.js, OrbitControls, Reflector, Tween -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/objects/Reflector.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
</head>
<body>

  <!-- Loading Screen -->
  <div id="loader">
    <div class="sakura-spinner">
      <svg viewBox="0 0 100 100">
        <path d="M50 50 C45 35 30 20 50 5 C70 20 55 35 50 50 Z" />
        <path d="M50 50 C35 45 20 30 5 50 C20 70 35 55 50 50 Z" transform="rotate(72 50 50)" />
        <path d="M50 50 C35 45 20 30 5 50 C20 70 35 55 50 50 Z" transform="rotate(144 50 50)" />
        <path d="M50 50 C35 45 20 30 5 50 C20 70 35 55 50 50 Z" transform="rotate(216 50 50)" />
        <path d="M50 50 C35 45 20 30 5 50 C20 70 35 55 50 50 Z" transform="rotate(288 50 50)" />
        <circle cx="50" cy="50" r="6" fill="#ffeaa7" />
      </svg>
    </div>
    <div class="loader-title">桜の谷 · 构建中</div>
    <div class="loader-sub">正在生成体素山谷、古树流光与水面镜像...</div>
    <div class="loader-bar">
      <div class="loader-bar-fill"></div>
    </div>
  </div>

  <!-- 3D Canvas Container -->
  <div id="webgl-container"></div>

  <!-- UI Overlay -->
  <div class="ui-layer" id="ui-layer">
    <!-- Top Left Japanese Brand Banner -->
    <div class="banner-title interactive">
      <div class="seal">春</div>
      <div class="subtitle-col" id="banner-mode-text">桜花山谷 · 蓝调时刻</div>
      <div class="vertical-text">桜の谷</div>
    </div>

    <!-- Bottom Controls Dock -->
    <div class="bottom-bar-container">
      <div class="control-dock interactive">
        <!-- Camera Views -->
        <div class="dock-group" id="views-group">
          <button class="btn active" data-view="panorama">山谷全景</button>
          <button class="btn" data-view="river">河边低机位</button>
          <button class="btn" data-view="temple">寺庙小径</button>
          <button class="btn" data-view="hill">山坡俯瞰</button>
        </div>

        <div class="dock-separator"></div>

        <!-- Atmospheres -->
        <div class="dock-group" id="atmos-group">
          <button class="btn active" data-atmo="bluehour">蓝调</button>
          <button class="btn" data-atmo="morning">清晨</button>
          <button class="btn" data-atmo="rain">雨中</button>
        </div>

        <div class="dock-separator"></div>

        <!-- Utility Buttons -->
        <div class="dock-group">
          <button class="btn btn-icon" id="btn-reset" title="重置视角">
            <svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
          </button>
          <button class="btn btn-icon" id="btn-tour" title="缓动漫游">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>
          </button>
          <button class="btn btn-icon" id="btn-sound" title="环境音效（点击开启）">
            <svg id="sound-icon-off" viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
            <svg id="sound-icon-on" style="display:none;" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
          </button>
          <button class="btn" id="btn-quality" title="画质模式切换">画质: 高</button>
          <button class="btn btn-icon" id="btn-snapshot" title="保存当前画面截屏">
            <svg viewBox="0 0 24 24"><path d="M9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
          </button>
          <button class="btn btn-icon" id="btn-hide-ui" title="隐藏界面 (可按空格键或点击右下角恢复)">
            <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Floating Button to Show UI When Hidden -->
  <div class="ui-show-trigger interactive" id="btn-show-ui" style="display:none;" title="恢复界面显示">
    <svg viewBox="0 0 24 24" style="width:20px;height:20px;fill:currentColor;"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zm0 13c-3.04 0-5.5-2.46-5.5-5.5S8.96 6.5 12 6.5s5.5 2.46 5.5 5.5-2.46 5.5-5.5 5.5z"/></svg>
  </div>

  <div class="toast-msg" id="toast-msg">视角已切换</div>

  <!-- MAIN SCRIPT -->
  <script>
    /* ========================================================
     * 桜の谷 (Sakura Valley) - Procedural Voxel 3D World
     * High-Fidelity Modern Voxel Landscape with Real-time Reflection
     * ======================================================== */

    const urlParams = new URLSearchParams(window.location.search);
    const initialViewParam = urlParams.get('view') || 'panorama';
    const initialAtmoParam = urlParams.get('atmo') || 'bluehour';
    const isTestMode = urlParams.get('test') === '1';

    const CONFIG = {
      voxelSize: 0.5,
      highQuality: true,
      autoTour: false,
      audioActive: false,
      currentView: initialViewParam,
      currentAtmo: initialAtmoParam
    };

    // Camera presets designed with exquisite framing & composition
    const CAMERA_PRESETS = {
      panorama: {
        pos: new THREE.Vector3(-19.5, 14.0, 27.5),
        target: new THREE.Vector3(2.5, 4.5, -9.0),
        fov: 46
      },
      river: {
        pos: new THREE.Vector3(-1.8, 1.85, 13.0),
        target: new THREE.Vector3(2.8, 3.2, -14.0),
        fov: 48
      },
      temple: {
        pos: new THREE.Vector3(10.5, 2.4, -5.0),
        target: new THREE.Vector3(14.5, 9.2, -34.0),
        fov: 48
      },
      hill: {
        pos: new THREE.Vector3(18.0, 17.5, 22.0),
        target: new THREE.Vector3(-1.0, 3.5, -12.0),
        fov: 48
      }
    };

    // Atmospheric configurations
    const ATMOSPHERES = {
      bluehour: {
        name: '桜花山谷 · 蓝调时刻',
        skyTop: '#111326',
        skyMid: '#322b52',
        skyBottom: '#6c4b6e',
        sunColor: '#9bb1de',
        sunIntensity: 0.95,
        sunPos: new THREE.Vector3(35, 42, -25),
        hemiSky: '#516084',
        hemiGround: '#202330',
        hemiIntensity: 0.9,
        ambientColor: '#302d4a',
        ambientIntensity: 0.55,
        fogColor: '#2b2a46',
        fogDensity: 0.009,
        exposure: 1.15,
        lanternIntensity: 4.5,
        rainActive: false,
        starOpacity: 0.95
      },
      morning: {
        name: '桜花山谷 · 清晨薄雾',
        skyTop: '#436f98',
        skyMid: '#e4996f',
        skyBottom: '#fce3b8',
        sunColor: '#fff1d0',
        sunIntensity: 1.5,
        sunPos: new THREE.Vector3(45, 28, -18),
        hemiSky: '#95b7db',
        hemiGround: '#4f6047',
        hemiIntensity: 0.95,
        ambientColor: '#5c646b',
        ambientIntensity: 0.5,
        fogColor: '#98a7b8',
        fogDensity: 0.0075,
        exposure: 1.18,
        lanternIntensity: 1.0,
        rainActive: false,
        starOpacity: 0.0
      },
      rain: {
        name: '桜花山谷 · 烟雨初霁',
        skyTop: '#242a32',
        skyMid: '#38434e',
        skyBottom: '#4e5a66',
        sunColor: '#78889a',
        sunIntensity: 0.58,
        sunPos: new THREE.Vector3(10, 40, -10),
        hemiSky: '#455059',
        hemiGround: '#262a2e',
        hemiIntensity: 0.72,
        ambientColor: '#2b3137',
        ambientIntensity: 0.42,
        fogColor: '#38434e',
        fogDensity: 0.015,
        exposure: 0.98,
        lanternIntensity: 5.2,
        rainActive: true,
        starOpacity: 0.0
      }
    };

    let scene, camera, renderer, controls;
    let mainDirLight, hemiLight, ambientLight, skyMesh;
    let waterReflector, waterPlane;
    let warmLights = [];
    let particleSystems = {};
    let koiGroup;
    let clock = new THREE.Clock();

    const PALETTE = {
      // Grass & Terrain
      grassLight: 0x6e954c,
      grassMid: 0x5a7d3c,
      grassDark: 0x476330,
      moss: 0x3d542a,
      dirt: 0x3a2e24,
      rockGray: 0x545860,
      rockDark: 0x383a40,
      rockLight: 0x737984,
      sand: 0x6b6455,
      stonePath: 0x7a808c,
      
      // Sakura
      sakuraPink1: 0xffb7c5,
      sakuraPink2: 0xfbc2cf,
      sakuraPink3: 0xfbdbe3,
      sakuraDeep: 0xf08fa8,
      sakuraWhite: 0xffffff,
      barkDark: 0x271912,
      barkMid: 0x3a241a,
      
      // Architecture
      woodRed: 0xc0392b,
      woodRedDark: 0x871f1b,
      woodPillar: 0x2d1c14,
      woodDeck: 0x563827,
      roofTileDark: 0x22262c,
      roofTileEdge: 0x343a44,
      shojiWhite: 0xf2eee7,
      shojiLit: 0xffb842,
      goldAccent: 0xd4af37,
      pagodaWhite: 0xeeebe3,
      pagodaRed: 0xb32c25,

      // Nature
      pineGreen: 0x1b3325,
      pineDark: 0x122218,
      reedGreen: 0x466d34,
      waterFallBlue: 0xd8eeff
    };

    const VOXEL_GEO = new THREE.BoxBufferGeometry(CONFIG.voxelSize, CONFIG.voxelSize, CONFIG.voxelSize);

    /* ========================================================
     * Precise Voxel Grid Builder (Solid & De-duplicated)
     * ======================================================== */
    class VoxelGridBuilder {
      constructor() {
        this.voxels = new Map();
        this.materialCache = new Map();
      }

      toGrid(val) {
        return Math.round(val / CONFIG.voxelSize);
      }

      add(colorHex, x, y, z, sx = 1, sy = 1, sz = 1) {
        const gx = this.toGrid(x);
        const gy = this.toGrid(y);
        const gz = this.toGrid(z);
        const key = `${gx},${gy},${gz}`;
        this.voxels.set(key, {
          x: gx * CONFIG.voxelSize,
          y: gy * CONFIG.voxelSize,
          z: gz * CONFIG.voxelSize,
          colorHex,
          sx, sy, sz
        });
      }

      addSolidSegment(colorHex, x1, y1, z1, x2, y2, z2, radius) {
        const dx = x2 - x1;
        const dy = y2 - y1;
        const dz = z2 - z1;
        const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
        const steps = Math.max(1, Math.ceil(dist / (CONFIG.voxelSize * 0.45)));
        const rSteps = Math.ceil(radius / CONFIG.voxelSize);

        for (let i = 0; i <= steps; i++) {
          const t = i / steps;
          const cx = x1 + dx * t;
          const cy = y1 + dy * t;
          const cz = z1 + dz * t;

          for (let rx = -rSteps; rx <= rSteps; rx++) {
            for (let ry = -rSteps; ry <= rSteps; ry++) {
              for (let rz = -rSteps; rz <= rSteps; rz++) {
                const ox = rx * CONFIG.voxelSize;
                const oy = ry * CONFIG.voxelSize;
                const oz = rz * CONFIG.voxelSize;
                if (ox * ox + oy * oy + oz * oz <= radius * radius + 0.05) {
                  this.add(colorHex, cx + ox, cy + oy, cz + oz);
                }
              }
            }
          }
        }
      }

      build(isShadowCaster = true, isEmissive = false) {
        const group = new THREE.Group();
        const dummy = new THREE.Object3D();

        const colorBuckets = new Map();
        this.voxels.forEach(v => {
          if (!colorBuckets.has(v.colorHex)) {
            colorBuckets.set(v.colorHex, []);
          }
          colorBuckets.get(v.colorHex).push(v);
        });

        colorBuckets.forEach((instances, hex) => {
          let mat = this.materialCache.get(hex);
          if (!mat) {
            mat = new THREE.MeshStandardMaterial({
              color: hex,
              roughness: isEmissive ? 0.2 : 0.82,
              metalness: isEmissive ? 0.0 : 0.06,
              emissive: isEmissive ? hex : 0x000000,
              emissiveIntensity: isEmissive ? 1.0 : 0.0,
              flatShading: false
            });
            this.materialCache.set(hex, mat);
          }

          const count = instances.length;
          const instancedMesh = new THREE.InstancedMesh(VOXEL_GEO, mat, count);
          instancedMesh.castShadow = isShadowCaster && !isEmissive;
          instancedMesh.receiveShadow = true;

          for (let i = 0; i < count; i++) {
            const d = instances[i];
            dummy.position.set(d.x, d.y, d.z);
            dummy.rotation.set(0, 0, 0);
            dummy.scale.set(d.sx, d.sy, d.sz);
            dummy.updateMatrix();
            instancedMesh.setMatrixAt(i, dummy.matrix);
          }

          instancedMesh.instanceMatrix.needsUpdate = true;
          group.add(instancedMesh);
        });

        return group;
      }
    }

    /* ========================================================
     * Procedural Scene Generation
     * ======================================================== */
    function buildSakuraValley() {
      const terrainBuilder = new VoxelGridBuilder();
      const foliageBuilder = new VoxelGridBuilder();
      const archBuilder = new VoxelGridBuilder();
      const emissiveBuilder = new VoxelGridBuilder();

      const vs = CONFIG.voxelSize;

      // 1. Terrain Height Function
      function getTerrainElevation(wx, wz) {
        // Curving river centerline
        const riverCenterX = 2.2 * Math.sin(wz * 0.045) + Math.cos(wz * 0.02) * 1.5;
        const distFromRiver = Math.abs(wx - riverCenterX);

        const riverHalfWidth = 4.8;
        if (distFromRiver < riverHalfWidth) {
          const bedDepth = -1.2 + Math.sin(distFromRiver * 0.4) * 0.35;
          return { height: bedDepth, isWater: true, riverDist: distFromRiver };
        }

        const bankDist = distFromRiver - riverHalfWidth;
        let baseHeight = 0.5;

        if (wx < 0) {
          // Left Bank: Gentle terraced foothills rising to high western ridge
          baseHeight += Math.pow(bankDist * 0.35, 1.25);
          baseHeight += Math.sin(wx * 0.18) * Math.cos(wz * 0.14) * 1.2;
          if (wz < -35) {
            baseHeight += Math.pow(Math.abs(wz + 35) * 0.28, 1.32);
          }
        } else {
          // Right Bank: Stepped plateau for teahouse and pagoda
          if (wx > 4.5 && wx < 18.5 && wz > -7 && wz < 13) {
            // Teahouse plateau
            baseHeight = 1.0;
          } else if (wx > 7.5 && wz < -18 && wz > -50) {
            // Pagoda terrace
            baseHeight = 6.5 + Math.sin(wx * 0.08) * 0.5;
          } else {
            baseHeight += Math.pow(bankDist * 0.33, 1.22);
            baseHeight += Math.cos(wx * 0.2) * Math.sin(wz * 0.1) * 1.1;
          }
          if (wz < -40) {
            baseHeight += Math.pow(Math.abs(wz + 40) * 0.3, 1.3);
          }
        }

        return { height: Math.max(0.4, baseHeight), isWater: false, riverDist: distFromRiver };
      }

      // Generate Terrain Voxels in a solid grid (completely filled down to ground level)
      const minX = -42, maxX = 42;
      const minZ = -80, maxZ = 35;

      for (let x = minX; x <= maxX; x += vs) {
        for (let z = minZ; z <= maxZ; z += vs) {
          const info = getTerrainElevation(x, z);
          const topY = Math.round(info.height / vs) * vs;

          if (info.isWater) {
            const bedY = Math.round(info.height / vs) * vs;
            const stoneColor = (Math.random() > 0.45) ? PALETTE.rockDark : PALETTE.rockGray;
            terrainBuilder.add(stoneColor, x, bedY, z);
            terrainBuilder.add(PALETTE.dirt, x, bedY - vs, z);
          } else {
            // Fill top 3 voxels deep for natural solid terrain
            const startY = Math.max(0, topY - vs * 3);
            for (let y = startY; y <= topY; y += vs) {
              const isTop = (Math.abs(y - topY) < vs * 0.5);
              const isSub = (Math.abs(y - (topY - vs)) < vs * 0.5);

              if (isTop) {
                let topColor;
                if (info.riverDist < 6.2 && topY <= 1.0) {
                  topColor = (Math.random() > 0.35) ? PALETTE.rockGray : PALETTE.sand;
                } else if (topY > 9.5) {
                  topColor = (Math.random() > 0.4) ? PALETTE.rockDark : PALETTE.rockGray;
                } else {
                  const r = Math.random();
                  topColor = (r > 0.6) ? PALETTE.grassLight : (r > 0.25 ? PALETTE.grassMid : PALETTE.grassDark);
                }
                terrainBuilder.add(topColor, x, y, z);
              } else if (isSub) {
                terrainBuilder.add(PALETTE.dirt, x, y, z);
              } else {
                terrainBuilder.add((Math.random() > 0.5) ? PALETTE.rockDark : PALETTE.rockGray, x, y, z);
              }
            }

            // Solid stone retaining wall under the Pagoda cliff
            if (x >= 7.5 && x <= 22.0 && z >= -48.0 && z <= -18.0 && topY >= 6.0) {
              for (let y = 1.0; y < startY; y += vs) {
                terrainBuilder.add((Math.random() > 0.45) ? PALETTE.rockDark : PALETTE.rockGray, x, y, z);
              }
            }

            // Riverbank vegetation: Reeds & flowers along water edge
            if (info.riverDist >= 4.8 && info.riverDist <= 7.2 && topY <= 1.5) {
              if (Math.random() < 0.24) {
                foliageBuilder.add(PALETTE.reedGreen, x, topY + vs, z, 0.7, 1.6, 0.7);
                if (Math.random() < 0.28) {
                  foliageBuilder.add(0xfff078, x, topY + vs * 2, z, 0.45, 0.45, 0.45);
                }
              }
            }
          }
        }
      }

      // Stone Path network connecting Bridge to Teahouse and Temple Hill
      function addStonePath(pStartX, pStartZ, pEndX, pEndZ, steps, pY) {
        for (let i = 0; i <= steps; i++) {
          const t = i / steps;
          const px = pStartX + (pEndX - pStartX) * t;
          const pz = pStartZ + (pEndZ - pStartZ) * t;
          archBuilder.add(PALETTE.stonePath, px, pY, pz, 1.2, 0.35, 1.2);
          if (Math.random() > 0.4) {
            archBuilder.add(PALETTE.stonePath, px + (Math.random() - 0.5) * 0.8, pY, pz + (Math.random() - 0.5) * 0.8, 0.8, 0.3, 0.8);
          }
        }
      }
      // Path from right bridge landing to Teahouse
      addStonePath(5.5, -0.5, 9.5, 2.5, 10, 1.05);
      // Path from Teahouse towards Temple Hill stairs
      addStonePath(11.5, -1.0, 13.5, -18.0, 24, 1.1);

      // Stone Stairs ascending to Pagoda Terrace
      for (let s = 0; s < 14; s++) {
        const sx = 13.5 + s * 0.15;
        const sz = -18.0 - s * 0.9;
        const sy = 1.2 + s * 0.42;
        for (let sw = -1.5; sw <= 1.5; sw += vs) {
          archBuilder.add(PALETTE.stonePath, sx + sw, sy, sz, 1.0, 0.6, 1.2);
        }
      }

      // 2. Distant Snow Mountain Peak (Mount Fuji silhouette at the center horizon)
      const fujiZ = -135;
      for (let fx = -32; fx <= 32; fx += vs * 1.5) {
        const distFromCenter = Math.abs(fx);
        if (distFromCenter > 30) continue;
        const peakHeight = 44 - Math.pow(distFromCenter * 0.42, 1.45);
        if (peakHeight > 8) {
          const topVoxelY = Math.round(peakHeight / vs) * vs;
          for (let fy = 8; fy <= topVoxelY; fy += vs * 1.5) {
            const isSnow = (fy > 28);
            const col = isSnow ? 0xf0f4f8 : PALETTE.rockDark;
            terrainBuilder.add(col, fx, fy, fujiZ, 1.5, 1.5, 1.5);
          }
        }
      }

      // 3. Voxel Waterfall at the Gorge (Z = -74)
      const wfX = 1.0;
      const wfZ = -74;
      for (let wy = 0.5; wy <= 18; wy += vs) {
        for (let wx = wfX - 3.2; wx <= wfX + 3.2; wx += vs) {
          const col = (Math.random() > 0.25) ? PALETTE.waterFallBlue : 0xffffff;
          foliageBuilder.add(col, wx, wy, wfZ + Math.sin(wy * 0.8) * 0.25, 0.95, 0.95, 0.95);
        }
      }

      // 4. Procedural Cherry Blossom Trees
      function buildCherryTree(baseX, baseY, baseZ, scale = 1.0, isAncient = false) {
        if (isAncient) {
          // Ancient Sakura Tree rooted at far left edge (X = -23, Z = 20, Y = 2.5)
          // Framing the TOP and LEFT edge of the screen completely leaving the center bridge open!
          const trunkNodes = [
            { x: baseX, y: baseY, z: baseZ, r: 1.8 },
            { x: baseX + 1.5, y: baseY + 3.5, z: baseZ - 1.2, r: 1.5 },
            { x: baseX + 3.0, y: baseY + 7.5, z: baseZ - 2.5, r: 1.3 },
            { x: baseX + 4.8, y: baseY + 11.5, z: baseZ - 3.8, r: 1.1 },
            { x: baseX + 6.5, y: baseY + 15.5, z: baseZ - 5.0, r: 0.9 }
          ];

          for (let i = 0; i < trunkNodes.length - 1; i++) {
            const n1 = trunkNodes[i];
            const n2 = trunkNodes[i + 1];
            archBuilder.addSolidSegment(PALETTE.barkDark, n1.x, n1.y, n1.z, n2.x, n2.y, n2.z, n1.r);
          }

          // Main branches:
          // Branch A: High overhead bough sweeping across the top frame (Y = 17 to 20, framing overhead)
          const topBranch = [
            { x: baseX + 6.5, y: baseY + 15.5, z: baseZ - 5.0 },
            { x: baseX + 11.0, y: baseY + 17.5, z: baseZ - 6.5 },
            { x: baseX + 16.0, y: baseY + 19.0, z: baseZ - 8.0 }
          ];
          for (let i = 0; i < topBranch.length - 1; i++) {
            archBuilder.addSolidSegment(PALETTE.barkMid, topBranch[i].x, topBranch[i].y, topBranch[i].z, topBranch[i+1].x, topBranch[i+1].y, topBranch[i+1].z, 0.7);
          }

          // Branch B: Left lateral bough
          const leftBranch = [
            { x: baseX + 3.0, y: baseY + 7.5, z: baseZ - 2.5 },
            { x: baseX - 2.5, y: baseY + 9.5, z: baseZ - 1.0 },
            { x: baseX - 6.0, y: baseY + 11.5, z: baseZ - 0.5 }
          ];
          for (let i = 0; i < leftBranch.length - 1; i++) {
            archBuilder.addSolidSegment(PALETTE.barkMid, leftBranch[i].x, leftBranch[i].y, leftBranch[i].z, leftBranch[i+1].x, leftBranch[i+1].y, leftBranch[i+1].z, 0.65);
          }

          // Branch C: Gentle forward-sloping bough on the left
          const fwdBranch = [
            { x: baseX + 4.8, y: baseY + 11.5, z: baseZ - 3.8 },
            { x: baseX + 7.5, y: baseY + 13.0, z: baseZ + 1.5 },
            { x: baseX + 9.5, y: baseY + 14.0, z: baseZ + 4.5 }
          ];
          for (let i = 0; i < fwdBranch.length - 1; i++) {
            archBuilder.addSolidSegment(PALETTE.barkMid, fwdBranch[i].x, fwdBranch[i].y, fwdBranch[i].z, fwdBranch[i+1].x, fwdBranch[i+1].y, fwdBranch[i+1].z, 0.65);
          }

          // Lush Blossom Clouds around branch ends
          const blossomClusters = [
            { x: baseX + 16.0, y: baseY + 19.2, z: baseZ - 8.0, rx: 4.8, ry: 3.2, rz: 4.5 },
            { x: baseX + 11.0, y: baseY + 18.0, z: baseZ - 6.5, rx: 4.2, ry: 3.0, rz: 4.0 },
            { x: baseX + 6.5, y: baseY + 16.5, z: baseZ - 5.0, rx: 4.5, ry: 3.2, rz: 4.2 },
            { x: baseX - 6.0, y: baseY + 11.8, z: baseZ - 0.5, rx: 4.0, ry: 2.8, rz: 3.8 },
            { x: baseX + 9.5, y: baseY + 14.5, z: baseZ + 4.5, rx: 4.4, ry: 3.0, rz: 4.2 },
            { x: baseX + 2.0, y: baseY + 10.5, z: baseZ - 3.0, rx: 3.8, ry: 2.6, rz: 3.5 }
          ];

          blossomClusters.forEach(bc => addBlossomCloud(bc.x, bc.y, bc.z, bc.rx, bc.ry, bc.rz));

        } else {
          const h = 7.0 * scale;
          const trunkEnd = { x: baseX + (Math.random() - 0.5) * 1.5, y: baseY + h, z: baseZ + (Math.random() - 0.5) * 1.5 };
          archBuilder.addSolidSegment(PALETTE.barkDark, baseX, baseY, baseZ, trunkEnd.x, trunkEnd.y, trunkEnd.z, 0.7 * scale);

          for (let b = 0; b < 3; b++) {
            const angle = (b / 3) * Math.PI * 2 + Math.random() * 0.5;
            const bx = trunkEnd.x + Math.cos(angle) * 3.0 * scale;
            const by = trunkEnd.y + (1.2 + Math.random() * 1.5) * scale;
            const bz = trunkEnd.z + Math.sin(angle) * 3.0 * scale;
            archBuilder.addSolidSegment(PALETTE.barkMid, trunkEnd.x, trunkEnd.y, trunkEnd.z, bx, by, bz, 0.45 * scale);
            addBlossomCloud(bx, by, bz, 3.2 * scale, 2.4 * scale, 3.2 * scale);
          }
        }
      }

      function addBlossomCloud(cx, cy, cz, rx, ry, rz) {
        const stepX = Math.ceil(rx / vs);
        const stepY = Math.ceil(ry / vs);
        const stepZ = Math.ceil(rz / vs);

        for (let ix = -stepX; ix <= stepX; ix++) {
          for (let iy = -stepY; iy <= stepY; iy++) {
            for (let iz = -stepZ; iz <= stepZ; iz++) {
              const ox = ix * vs;
              const oy = iy * vs;
              const oz = iz * vs;
              const d = (ox * ox) / (rx * rx) + (oy * oy) / (ry * ry) + (oz * oz) / (rz * rz);
              const noise = (Math.sin(ox * 2.0) * Math.cos(oz * 2.0) + Math.sin(oy * 2.5)) * 0.16;

              if (d + noise <= 1.0) {
                const rand = Math.random();
                let col = PALETTE.sakuraPink1;
                if (rand > 0.78) col = PALETTE.sakuraWhite;
                else if (rand > 0.50) col = PALETTE.sakuraPink2;
                else if (rand > 0.22) col = PALETTE.sakuraPink3;
                else col = PALETTE.sakuraDeep;

                foliageBuilder.add(col, cx + ox, cy + oy, cz + oz, 0.96, 0.96, 0.96);
              }
            }
          }
        }
      }

      // Build Ancient Sakura Tree at far left edge
      buildCherryTree(-23.0, 2.5, 20.0, 1.4, true);

      // Additional Cherry Trees across the slopes for atmospheric depth
      const sakuraSpots = [
        { x: -16, y: 3.2, z: 2.0, scale: 1.05 },
        { x: -22, y: 6.2, z: -18.0, scale: 1.15 },
        { x: -14, y: 4.0, z: -35.0, scale: 1.0 },
        { x: 21, y: 3.0, z: 12.0, scale: 1.0 },
        { x: 23, y: 7.5, z: -16.0, scale: 1.1 },
        { x: 8, y: 6.8, z: -48.0, scale: 1.0 }
      ];
      sakuraSpots.forEach(s => buildCherryTree(s.x, s.y, s.z, s.scale, false));

      // 5. Pine Trees on high ridges
      function buildPineTree(px, py, pz, pHeight = 7) {
        archBuilder.addSolidSegment(PALETTE.barkDark, px, py, pz, px, py + pHeight, pz, 0.6);
        const tiers = 4;
        for (let t = 0; t < tiers; t++) {
          const tierY = py + pHeight * (0.35 + t * 0.22);
          const tierR = (tiers - t) * 0.85;
          const rSteps = Math.ceil(tierR / vs);
          for (let ix = -rSteps; ix <= rSteps; ix++) {
            for (let iz = -rSteps; iz <= rSteps; iz++) {
              if (ix * ix + iz * iz <= rSteps * rSteps) {
                const col = (Math.random() > 0.4) ? PALETTE.pineGreen : PALETTE.pineDark;
                foliageBuilder.add(col, px + ix * vs, tierY, pz + iz * vs, 0.92, 0.92, 0.92);
              }
            }
          }
        }
      }

      const pineSpots = [
        [-30, 8, -6], [-34, 12, -26], [-28, 14, -58], [-18, 16, -70],
        [28, 8, 3], [33, 13, -24], [28, 15, -52], [18, 17, -68]
      ];
      pineSpots.forEach(s => buildPineTree(s[0], s[1], s[2], 7 + Math.random() * 3));

      // 6. Traditional Japanese Teahouse (和風茶屋)
      const thX = 11.0, thY = 1.0, thZ = 3.5;
      const thW = 10, thD = 8;
      const halfW = (thW * vs) / 2;
      const halfD = (thD * vs) / 2;

      // Solid Stone Foundation
      for (let ix = -halfW - vs; ix <= halfW + vs; ix += vs) {
        for (let iz = -halfD - vs; iz <= halfD + vs; iz += vs) {
          for (let y = 0; y <= thY; y += vs) {
            archBuilder.add(PALETTE.rockGray, thX + ix, y, thZ + iz);
          }
        }
      }

      // Wooden Engawa Deck extending towards the river
      for (let ix = -halfW - vs * 2.5; ix <= halfW + vs; ix += vs) {
        for (let iz = -halfD - vs; iz <= halfD + vs; iz += vs) {
          archBuilder.add(PALETTE.woodDeck, thX + ix, thY + vs, thZ + iz);
        }
      }

      // Timber Posts and Shoji Screen Walls
      const wallH = 6;
      for (let iy = 1; iy <= wallH; iy++) {
        const currY = thY + vs * (1 + iy);
        for (let ix = -halfW; ix <= halfW; ix += vs) {
          for (let iz = -halfD; iz <= halfD; iz += vs) {
            const isCorner = (Math.abs(ix - halfW) < 0.1 || Math.abs(ix + halfW) < 0.1) &&
                             (Math.abs(iz - halfD) < 0.1 || Math.abs(iz + halfD) < 0.1);
            const isEdge = (Math.abs(ix - halfW) < 0.1 || Math.abs(ix + halfW) < 0.1) ||
                           (Math.abs(iz - halfD) < 0.1 || Math.abs(iz + halfD) < 0.1);

            if (isCorner) {
              archBuilder.add(PALETTE.woodPillar, thX + ix, currY, thZ + iz, 0.9, 1.0, 0.9);
            } else if (isEdge) {
              if (iy <= 2) {
                archBuilder.add(PALETTE.woodPillar, thX + ix, currY, thZ + iz);
              } else if (iy >= 3 && iy <= 5) {
                emissiveBuilder.add(PALETTE.shojiLit, thX + ix, currY, thZ + iz, 0.92, 0.92, 0.92);
              } else {
                archBuilder.add(PALETTE.woodPillar, thX + ix, currY, thZ + iz);
              }
            }
          }
        }
      }

      // Multi-layer Hipped-and-Gabled Roof (入母屋造)
      const roofBaseY = thY + vs * (2 + wallH);
      const roofLayers = 6;
      for (let r = 0; r < roofLayers; r++) {
        const ry = roofBaseY + r * vs * 0.9;
        const eaveOverhang = (roofLayers - r) * vs * 0.88;
        const rxW = halfW + eaveOverhang;
        const rxD = halfD + eaveOverhang;

        for (let ix = -rxW; ix <= rxW; ix += vs) {
          for (let iz = -rxD; iz <= rxD; iz += vs) {
            const isEdge = Math.abs(Math.abs(ix) - rxW) < vs || Math.abs(Math.abs(iz) - rxD) < vs;
            const tileCol = isEdge ? PALETTE.roofTileEdge : PALETTE.roofTileDark;
            archBuilder.add(tileCol, thX + ix, ry, thZ + iz, 0.98, 0.85, 0.98);
          }
        }
      }

      // Ridge Beam Crest (大棟)
      const ridgeY = roofBaseY + roofLayers * vs * 0.9;
      for (let ix = -halfW; ix <= halfW; ix += vs) {
        archBuilder.add(PALETTE.roofTileEdge, thX + ix, ridgeY, thZ, 1.0, 1.2, 0.6);
      }

      // Red Hanging Lanterns along the Teahouse Veranda
      const teahouseLanterns = [
        { x: thX - halfW - vs, y: roofBaseY - vs, z: thZ - 1.5 },
        { x: thX - halfW - vs, y: roofBaseY - vs, z: thZ + 1.5 }
      ];
      teahouseLanterns.forEach(lp => {
        emissiveBuilder.add(PALETTE.woodRed, lp.x, lp.y, lp.z, 0.7, 1.1, 0.7);
        const pl = new THREE.PointLight(0xff9933, 2.8, 11);
        pl.position.set(lp.x, lp.y, lp.z);
        scene.add(pl);
        warmLights.push(pl);
      });

      // Warm Interior Ambient Glow from inside Teahouse
      const thInnerLight = new THREE.PointLight(0xffaa44, 4.5, 17);
      thInnerLight.position.set(thX, thY + vs * 4, thZ);
      scene.add(thInnerLight);
      warmLights.push(thInnerLight);

      // 7. Five-Story Pagoda (五重塔) on Elevated Hill
      // Solidly anchored onto its foundation terrace with continuous stacking!
      const pgX = 14.5, pgY = 6.5, pgZ = -34.0;
      const pgTiers = 5;

      // Solid Stone Terrace Podium
      for (let ix = -6.5; ix <= 6.5; ix += vs) {
        for (let iz = -6.5; iz <= 6.5; iz += vs) {
          for (let y = 0; y <= pgY; y += vs) {
            archBuilder.add(PALETTE.rockGray, pgX + ix, y, pgZ + iz);
          }
        }
      }

      let currTierY = pgY + vs;
      for (let tier = 0; tier < pgTiers; tier++) {
        const tierScale = 1.0 - tier * 0.12;
        const bodyW = 3.6 * tierScale;
        const bodyH = 2.8 * tierScale;

        // Balcony Deck around this tier
        const balSpan = bodyW + vs * 1.2;
        for (let ix = -balSpan; ix <= balSpan; ix += vs) {
          for (let iz = -balSpan; iz <= balSpan; iz += vs) {
            archBuilder.add(PALETTE.woodDeck, pgX + ix, currTierY, pgZ + iz, 1.0, 0.5, 1.0);
            const isBalEdge = Math.abs(Math.abs(ix) - balSpan) < vs * 0.5 || Math.abs(Math.abs(iz) - balSpan) < vs * 0.5;
            if (isBalEdge) {
              archBuilder.add(PALETTE.woodRed, pgX + ix, currTierY + vs, pgZ + iz, 0.4, 0.8, 0.4);
            }
          }
        }

        // Core walls & columns
        const coreFloorY = currTierY + vs;
        for (let iy = 0; iy < bodyH; iy += vs) {
          for (let ix = -bodyW; ix <= bodyW; ix += vs) {
            for (let iz = -bodyW; iz <= bodyW; iz += vs) {
              const isCorner = Math.abs(Math.abs(ix) - bodyW) < vs && Math.abs(Math.abs(iz) - bodyW) < vs;
              const isOuter = Math.abs(Math.abs(ix) - bodyW) < vs || Math.abs(Math.abs(iz) - bodyW) < vs;

              if (isCorner) {
                archBuilder.add(PALETTE.pagodaRed, pgX + ix, coreFloorY + iy, pgZ + iz, 0.9, 1.0, 0.9);
              } else if (isOuter) {
                if (iy > vs && iy < bodyH - vs && (Math.abs(ix) < vs || Math.abs(iz) < vs)) {
                  emissiveBuilder.add(PALETTE.shojiLit, pgX + ix, coreFloorY + iy, pgZ + iz, 0.7, 0.7, 0.7);
                } else {
                  archBuilder.add(PALETTE.pagodaWhite, pgX + ix, coreFloorY + iy, pgZ + iz);
                }
              }
            }
          }
        }

        // Bracket System (斗栱) directly under roof
        const bracketY = coreFloorY + bodyH;
        for (let ix = -bodyW - vs * 0.6; ix <= bodyW + vs * 0.6; ix += vs) {
          for (let iz = -bodyW - vs * 0.6; iz <= bodyW + vs * 0.6; iz += vs) {
            if (Math.abs(ix) > bodyW * 0.6 || Math.abs(iz) > bodyW * 0.6) {
              archBuilder.add(PALETTE.pagodaRed, pgX + ix, bracketY, pgZ + iz, 0.8, 0.6, 0.8);
            }
          }
        }

        // Layered Curved Tiled Roof
        const roofY = bracketY + vs * 0.6;
        const eaveSpan = bodyW + 2.4 * tierScale;
        for (let ix = -eaveSpan; ix <= eaveSpan; ix += vs) {
          for (let iz = -eaveSpan; iz <= eaveSpan; iz += vs) {
            const isEdge = Math.abs(Math.abs(ix) - eaveSpan) < vs || Math.abs(Math.abs(iz) - eaveSpan) < vs;
            const tileCol = isEdge ? PALETTE.roofTileEdge : PALETTE.roofTileDark;
            archBuilder.add(tileCol, pgX + ix, roofY, pgZ + iz, 1.0, 0.7, 1.0);
          }
        }

        // Upturned corner eaves
        const cornerPoints = [
          [-eaveSpan, -eaveSpan], [eaveSpan, -eaveSpan],
          [-eaveSpan, eaveSpan], [eaveSpan, eaveSpan]
        ];
        cornerPoints.forEach(cp => {
          archBuilder.add(PALETTE.roofTileEdge, pgX + cp[0], roofY + vs * 0.6, pgZ + cp[1], 0.8, 0.8, 0.8);
          emissiveBuilder.add(PALETTE.goldAccent, pgX + cp[0], roofY - vs * 0.4, pgZ + cp[1], 0.4, 0.4, 0.4);
        });

        // Warm light on Tier 1 & Tier 3
        if (tier === 0 || tier === 2) {
          const pLight = new THREE.PointLight(0xffaa44, 2.2, 10);
          pLight.position.set(pgX, coreFloorY + 1.2, pgZ);
          scene.add(pLight);
          warmLights.push(pLight);
        }

        // Next tier starts smoothly on top of this tier's roof!
        currTierY = roofY + vs * 0.8;
      }

      // Spire Finial (相輪 Sorin)
      for (let sy = 0; sy < 10; sy += vs) {
        const ringCol = (sy % 2 === 0) ? PALETTE.goldAccent : PALETTE.roofTileEdge;
        const rScale = (sy > 8) ? 0.3 : (sy % 2 === 0 ? 0.9 : 0.4);
        archBuilder.add(ringCol, pgX, currTierY + sy, pgZ, rScale, 1.0, rScale);
      }

      // 8. Graceful Red Arched Wooden Bridge (太鼓桥 Taiko-bashi)
      // Arching smoothly across the river with open water underneath!
      const bridgeZ = -0.5;
      const bridgeStartX = -6.0;
      const bridgeEndX = 6.0;
      const bridgeSpan = bridgeEndX - bridgeStartX;

      for (let bx = bridgeStartX; bx <= bridgeEndX; bx += vs * 0.75) {
        const nx = ((bx - bridgeStartX) / bridgeSpan) * 2 - 1; // -1 to 1
        const archY = 0.95 + (1.0 - nx * nx) * 1.65; // High graceful curve reaching 2.6m

        // Wooden Deck Planks (5 voxels wide)
        for (let bz = -1.2; bz <= 1.2; bz += vs) {
          archBuilder.add(PALETTE.woodRed, bx, archY, bridgeZ + bz, 0.95, 0.45, 0.95);
        }

        // Railing Posts and Handrails
        const railZ = [-1.3, 1.3];
        railZ.forEach(rz => {
          archBuilder.add(PALETTE.woodRedDark, bx, archY + vs * 0.9, bridgeZ + rz, 0.45, 1.1, 0.45);
          archBuilder.add(PALETTE.woodRed, bx, archY + vs * 1.5, bridgeZ + rz, 0.9, 0.4, 0.5);

          // Golden finials on bridge posts
          if (Math.abs(bx - bridgeStartX) < 0.6 || Math.abs(bx - bridgeEndX) < 0.6 || Math.abs(bx) < 0.5) {
            emissiveBuilder.add(PALETTE.goldAccent, bx, archY + vs * 1.9, bridgeZ + rz, 0.45, 0.45, 0.45);
          }
        });
      }

      // Clean, elegant timber piers (2 pairs at quarters) leaving center arch completely open for mirror reflections!
      const pierX = [-3.0, 3.0];
      pierX.forEach(px => {
        const nx = ((px - bridgeStartX) / bridgeSpan) * 2 - 1;
        const archY = 0.95 + (1.0 - nx * nx) * 1.65;
        for (let py = 0; py < archY; py += vs) {
          archBuilder.add(PALETTE.woodPillar, px, py, bridgeZ - 0.9, 0.6, 1.0, 0.6);
          archBuilder.add(PALETTE.woodPillar, px, py, bridgeZ + 0.9, 0.6, 1.0, 0.6);
        }
      });

      // 9. Stone Lanterns (石灯籠 Toro)
      function buildStoneLantern(lx, ly, lz) {
        archBuilder.add(PALETTE.rockGray, lx, ly, lz, 0.8, 0.4, 0.8);
        archBuilder.add(PALETTE.rockDark, lx, ly + vs * 0.5, lz, 0.4, 0.8, 0.4);
        emissiveBuilder.add(PALETTE.shojiLit, lx, ly + vs * 1.2, lz, 0.55, 0.55, 0.55);
        archBuilder.add(PALETTE.rockGray, lx, ly + vs * 1.7, lz, 1.1, 0.35, 1.1);
        archBuilder.add(PALETTE.rockDark, lx, ly + vs * 2.1, lz, 0.35, 0.4, 0.35);

        const pl = new THREE.PointLight(0xffa040, 2.0, 8);
        pl.position.set(lx, ly + vs * 1.2, lz);
        scene.add(pl);
        warmLights.push(pl);
      }

      const lanternSpots = [
        [-6.8, 0.9, 3.8],   // Left bank near bridge
        [6.2, 0.9, -3.2],   // Right bank near bridge
        [-16.0, 1.8, 12.0], // Under ancient sakura hillside
        [10.0, 5.8, -18.0], // Temple path start
        [13.5, 7.0, -28.0]  // Temple terrace entrance
      ];
      lanternSpots.forEach(s => buildStoneLantern(s[0], s[1], s[2]));

      // 10. Torii Gate (鳥居) on the left hillside trail
      const trX = -13.5, trY = 3.2, trZ = -10.0;
      const trW = 3.6;
      for (let ty = 0; ty <= 5; ty += vs) {
        archBuilder.add(PALETTE.woodRed, trX - trW / 2, trY + ty, trZ, 0.6, 1.0, 0.6);
        archBuilder.add(PALETTE.woodRed, trX + trW / 2, trY + ty, trZ, 0.6, 1.0, 0.6);
      }
      for (let tx = -trW / 2 - vs * 1.2; tx <= trW / 2 + vs * 1.2; tx += vs * 0.8) {
        archBuilder.add(PALETTE.woodRed, trX + tx, trY + 4.2, trZ, 0.9, 0.4, 0.6);
        archBuilder.add(PALETTE.roofTileDark, trX + tx, trY + 5.2, trZ, 0.95, 0.5, 0.7);
      }

      // Add all generated batches to the scene
      scene.add(terrainBuilder.build(true, false));
      scene.add(foliageBuilder.build(true, false));
      scene.add(archBuilder.build(true, false));
      scene.add(emissiveBuilder.build(false, true));

      buildKoiFishGroup();
      buildFloatingWaterPetals();
    }

    /* ========================================================
     * Floating Sakura Petals on the River Surface
     * ======================================================== */
    let waterPetalsGroup;
    function buildFloatingWaterPetals() {
      waterPetalsGroup = new THREE.Group();
      const petalMat = new THREE.MeshStandardMaterial({
        color: PALETTE.sakuraPink1,
        roughness: 0.4,
        emissive: PALETTE.sakuraDeep,
        emissiveIntensity: 0.15
      });
      const petalGeo = new THREE.PlaneBufferGeometry(0.3, 0.22);
      petalGeo.rotateX(-Math.PI / 2);

      const numWaterPetals = 45;
      for (let i = 0; i < numWaterPetals; i++) {
        const mesh = new THREE.Mesh(petalGeo, petalMat);
        mesh.position.set(
          (Math.random() - 0.5) * 6.5,
          0.22,
          -45 + Math.random() * 65
        );
        mesh.rotation.y = Math.random() * Math.PI * 2;
        mesh.userData = {
          speedZ: 0.6 + Math.random() * 0.4,
          driftAngle: Math.random() * 10
        };
        waterPetalsGroup.add(mesh);
      }
      scene.add(waterPetalsGroup);
    }

    function updateWaterPetals(dt) {
      if (!waterPetalsGroup) return;
      waterPetalsGroup.children.forEach(p => {
        p.position.z += p.userData.speedZ * dt * 0.8;
        p.userData.driftAngle += dt * 1.5;
        p.position.x += Math.sin(p.userData.driftAngle) * 0.008;

        if (p.position.z > 25) {
          p.position.z = -45;
          p.position.x = (Math.random() - 0.5) * 6.5;
        }
      });
    }

    /* ========================================================
     * Voxel Koi Fish Swimming in the River
     * ======================================================== */
    function buildKoiFishGroup() {
      koiGroup = new THREE.Group();
      const fishColors = [0xe74c3c, 0xf39c12, 0xffffff];
      const numFish = 7;

      for (let i = 0; i < numFish; i++) {
        const fish = new THREE.Group();
        const baseCol = fishColors[i % fishColors.length];
        const fishMat = new THREE.MeshStandardMaterial({
          color: baseCol,
          roughness: 0.3,
          emissive: baseCol,
          emissiveIntensity: 0.25
        });

        const head = new THREE.Mesh(new THREE.BoxBufferGeometry(0.3, 0.18, 0.4), fishMat);
        head.position.z = 0.25;
        fish.add(head);

        const body = new THREE.Mesh(new THREE.BoxBufferGeometry(0.24, 0.16, 0.4), fishMat);
        fish.add(body);

        const tail = new THREE.Mesh(new THREE.BoxBufferGeometry(0.12, 0.22, 0.3), fishMat);
        tail.position.z = -0.3;
        fish.add(tail);

        fish.userData = {
          angle: (i / numFish) * Math.PI * 2,
          radiusX: 3.5 + Math.random() * 2.5,
          radiusZ: 4.5 + Math.random() * 3.5,
          speed: 0.35 + Math.random() * 0.25,
          baseY: -0.15 + (Math.random() * 0.15),
          swimWiggle: Math.random() * 10
        };

        koiGroup.add(fish);
      }

      scene.add(koiGroup);
    }

    function updateKoiFish(dt) {
      if (!koiGroup) return;
      koiGroup.children.forEach(fish => {
        const ud = fish.userData;
        ud.angle += ud.speed * dt * 0.6;
        ud.swimWiggle += dt * 5.0;

        const x = Math.sin(ud.angle) * ud.radiusX;
        const z = -2.0 + Math.cos(ud.angle) * ud.radiusZ;
        const y = ud.baseY + Math.sin(ud.swimWiggle * 0.5) * 0.05;

        fish.position.set(x, y, z);
        const nextX = Math.sin(ud.angle + 0.05) * ud.radiusX;
        const nextZ = -2.0 + Math.cos(ud.angle + 0.05) * ud.radiusZ;
        fish.lookAt(nextX, y, nextZ);

        const tail = fish.children[2];
        if (tail) {
          tail.rotation.y = Math.sin(ud.swimWiggle) * 0.35;
        }
      });
    }

    /* ========================================================
     * Dynamic Water Surface with True Reflection (THREE.Reflector)
     * ======================================================== */
    function setupWaterReflector() {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');
      const imgData = ctx.createImageData(256, 256);
      for (let y = 0; y < 256; y++) {
        for (let x = 0; x < 256; x++) {
          const idx = (y * 256 + x) * 4;
          const nx = Math.sin(x * 0.12) * 25 + 128;
          const ny = Math.cos(y * 0.12) * 25 + 128;
          imgData.data[idx] = nx;
          imgData.data[idx + 1] = ny;
          imgData.data[idx + 2] = 255;
          imgData.data[idx + 3] = 255;
        }
      }
      ctx.putImageData(imgData, 0, 0);
      const rippleTexture = new THREE.CanvasTexture(canvas);
      rippleTexture.wrapS = THREE.RepeatWrapping;
      rippleTexture.wrapT = THREE.RepeatWrapping;
      rippleTexture.repeat.set(16, 32);

      const waterWidth = 26;
      const waterLength = 115;
      const waterGeometry = new THREE.PlaneBufferGeometry(waterWidth, waterLength);

      waterReflector = new THREE.Reflector(waterGeometry, {
        clipBias: 0.003,
        textureWidth: window.innerWidth * (window.devicePixelRatio || 1) * 0.75,
        textureHeight: window.innerHeight * (window.devicePixelRatio || 1) * 0.75,
        color: 0x3d4f68,
        recursion: 0
      });
      waterReflector.rotation.x = -Math.PI / 2;
      waterReflector.position.set(0.5, 0.18, -20);
      scene.add(waterReflector);

      const overlayGeo = new THREE.PlaneBufferGeometry(waterWidth, waterLength);
      const overlayMat = new THREE.MeshStandardMaterial({
        color: 0x1f3448,
        roughness: 0.15,
        metalness: 0.35,
        transparent: true,
        opacity: 0.58,
        normalMap: rippleTexture,
        normalScale: new THREE.Vector2(0.04, 0.04)
      });
      waterPlane = new THREE.Mesh(overlayGeo, overlayMat);
      waterPlane.rotation.x = -Math.PI / 2;
      waterPlane.position.set(0.5, 0.20, -20);
      scene.add(waterPlane);

      waterPlane.userData.rippleTexture = rippleTexture;
    }

    function updateWater(dt) {
      if (waterPlane && waterPlane.userData.rippleTexture) {
        waterPlane.userData.rippleTexture.offset.y += dt * 0.04;
        waterPlane.userData.rippleTexture.offset.x += dt * 0.015;
      }
      updateWaterPetals(dt);
    }

    /* ========================================================
     * Atmospheric Particle Systems
     * ======================================================== */
    function setupParticleSystems() {
      // 1. Falling Sakura Petals (花吹雪)
      const petalCount = 450;
      const petalGeo = new THREE.BufferGeometry();
      const petalPos = new Float32Array(petalCount * 3);
      const petalSpeeds = new Float32Array(petalCount * 3);
      const petalRot = new Float32Array(petalCount);

      for (let i = 0; i < petalCount; i++) {
        petalPos[i * 3] = (Math.random() - 0.5) * 60;
        petalPos[i * 3 + 1] = 1.0 + Math.random() * 22;
        petalPos[i * 3 + 2] = -50 + Math.random() * 85;

        petalSpeeds[i * 3] = 0.4 + Math.random() * 0.8;
        petalSpeeds[i * 3 + 1] = 0.6 + Math.random() * 0.7;
        petalSpeeds[i * 3 + 2] = 0.3 + Math.random() * 0.5;
        petalRot[i] = Math.random() * Math.PI * 2;
      }

      petalGeo.setAttribute('position', new THREE.BufferAttribute(petalPos, 3));
      petalGeo.setAttribute('speed', new THREE.BufferAttribute(petalSpeeds, 3));
      petalGeo.setAttribute('rot', new THREE.BufferAttribute(petalRot, 1));

      const petalCanvas = document.createElement('canvas');
      petalCanvas.width = 32;
      petalCanvas.height = 32;
      const pctx = petalCanvas.getContext('2d');
      pctx.fillStyle = '#ffb7c5';
      pctx.beginPath();
      pctx.ellipse(16, 16, 12, 7, Math.PI / 4, 0, Math.PI * 2);
      pctx.fill();
      const petalTex = new THREE.CanvasTexture(petalCanvas);

      const petalMat = new THREE.PointsMaterial({
        size: 0.5,
        map: petalTex,
        transparent: true,
        opacity: 0.88,
        depthWrite: false,
        blending: THREE.NormalBlending
      });

      const petalPoints = new THREE.Points(petalGeo, petalMat);
      scene.add(petalPoints);
      particleSystems.petals = petalPoints;

      // 2. Stars for Blue Hour
      const starCount = 300;
      const starGeo = new THREE.BufferGeometry();
      const starPos = new Float32Array(starCount * 3);
      for (let i = 0; i < starCount; i++) {
        starPos[i * 3] = (Math.random() - 0.5) * 160;
        starPos[i * 3 + 1] = 25 + Math.random() * 45;
        starPos[i * 3 + 2] = -120 + Math.random() * 90;
      }
      starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
      const starMat = new THREE.PointsMaterial({
        color: 0xffffff,
        size: 0.45,
        transparent: true,
        opacity: 0.95,
        depthWrite: false
      });
      const starPoints = new THREE.Points(starGeo, starMat);
      scene.add(starPoints);
      particleSystems.stars = starPoints;

      // 3. Falling Rain System (for 雨中 mode)
      const rainCount = 1800;
      const rainGeo = new THREE.BufferGeometry();
      const rainPos = new Float32Array(rainCount * 3);
      for (let i = 0; i < rainCount; i++) {
        rainPos[i * 3] = (Math.random() - 0.5) * 70;
        rainPos[i * 3 + 1] = Math.random() * 35;
        rainPos[i * 3 + 2] = -60 + Math.random() * 90;
      }
      rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
      const rainMat = new THREE.PointsMaterial({
        color: 0x9cb4cc,
        size: 0.22,
        transparent: true,
        opacity: 0.0,
        depthWrite: false
      });
      const rainPoints = new THREE.Points(rainGeo, rainMat);
      scene.add(rainPoints);
      particleSystems.rain = rainPoints;
    }

    function updateParticles(dt) {
      if (particleSystems.petals) {
        const positions = particleSystems.petals.geometry.attributes.position.array;
        const speeds = particleSystems.petals.geometry.attributes.speed.array;
        const count = positions.length / 3;

        for (let i = 0; i < count; i++) {
          positions[i * 3] += Math.sin(clock.elapsedTime + i) * 0.04 + speeds[i * 3] * dt;
          positions[i * 3 + 1] -= speeds[i * 3 + 1] * dt * 2.2;
          positions[i * 3 + 2] += Math.cos(clock.elapsedTime * 0.8 + i) * 0.03 + speeds[i * 3 + 2] * dt;

          if (positions[i * 3 + 1] < 0.2) {
            positions[i * 3 + 1] = 20 + Math.random() * 4;
            positions[i * 3] = (Math.random() - 0.5) * 55;
            positions[i * 3 + 2] = -50 + Math.random() * 85;
          }
        }
        particleSystems.petals.geometry.attributes.position.needsUpdate = true;
      }

      if (particleSystems.rain && particleSystems.rain.material.opacity > 0.05) {
        const rPos = particleSystems.rain.geometry.attributes.position.array;
        const rCount = rPos.length / 3;
        for (let i = 0; i < rCount; i++) {
          rPos[i * 3 + 1] -= dt * 38.0;
          rPos[i * 3] += dt * 2.5;
          if (rPos[i * 3 + 1] < 0.2) {
            rPos[i * 3 + 1] = 32 + Math.random() * 5;
          }
        }
        particleSystems.rain.geometry.attributes.position.needsUpdate = true;
      }
    }

    /* ========================================================
     * Atmospheric Sky Dome & Lighting Controller
     * ======================================================== */
    function setupSkyAndLighting() {
      const skyGeo = new THREE.SphereBufferGeometry(220, 32, 16);
      const skyCanvas = document.createElement('canvas');
      skyCanvas.width = 16;
      skyCanvas.height = 256;
      const sctx = skyCanvas.getContext('2d');
      const skyTexture = new THREE.CanvasTexture(skyCanvas);
      skyTexture.wrapS = THREE.ClampToEdgeWrapping;
      skyTexture.wrapT = THREE.ClampToEdgeWrapping;

      const skyMat = new THREE.MeshBasicMaterial({
        map: skyTexture,
        side: THREE.BackSide,
        depthWrite: false
      });
      skyMesh = new THREE.Mesh(skyGeo, skyMat);
      skyMesh.userData = { canvas: skyCanvas, ctx: sctx, texture: skyTexture };
      scene.add(skyMesh);

      mainDirLight = new THREE.DirectionalLight(0x9bb1de, 0.95);
      mainDirLight.position.set(35, 42, -25);
      mainDirLight.castShadow = true;
      mainDirLight.shadow.mapSize.width = 2048;
      mainDirLight.shadow.mapSize.height = 2048;
      mainDirLight.shadow.camera.near = 10;
      mainDirLight.shadow.camera.far = 135;
      mainDirLight.shadow.camera.left = -45;
      mainDirLight.shadow.camera.right = 45;
      mainDirLight.shadow.camera.top = 45;
      mainDirLight.shadow.camera.bottom = -45;
      mainDirLight.shadow.bias = -0.0004;
      scene.add(mainDirLight);

      hemiLight = new THREE.HemisphereLight(0x516084, 0x202330, 0.9);
      scene.add(hemiLight);

      ambientLight = new THREE.AmbientLight(0x302d4a, 0.55);
      scene.add(ambientLight);

      scene.fog = new THREE.FogExp2(0x2b2a46, 0.009);

      applyAtmosphere(CONFIG.currentAtmo, false);
    }

    function updateSkyGradient(topColor, midColor, bottomColor) {
      if (!skyMesh) return;
      const ctx = skyMesh.userData.ctx;
      const grad = ctx.createLinearGradient(0, 0, 0, 256);
      grad.addColorStop(0.0, topColor);
      grad.addColorStop(0.55, midColor);
      grad.addColorStop(1.0, bottomColor);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 16, 256);
      skyMesh.userData.texture.needsUpdate = true;
    }

    function applyAtmosphere(atmoKey, animate = true) {
      const atmo = ATMOSPHERES[atmoKey];
      if (!atmo) return;
      CONFIG.currentAtmo = atmoKey;

      const bannerText = document.getElementById('banner-mode-text');
      if (bannerText) bannerText.innerText = atmo.name;

      if (!animate) {
        updateSkyGradient(atmo.skyTop, atmo.skyMid, atmo.skyBottom);
        mainDirLight.color.set(atmo.sunColor);
        mainDirLight.intensity = atmo.sunIntensity;
        mainDirLight.position.copy(atmo.sunPos);

        hemiLight.color.set(atmo.hemiSky);
        hemiLight.groundColor.set(atmo.hemiGround);
        hemiLight.intensity = atmo.hemiIntensity;

        ambientLight.color.set(atmo.ambientColor);
        ambientLight.intensity = atmo.ambientIntensity;

        scene.fog.color.set(atmo.fogColor);
        scene.fog.density = atmo.fogDensity;

        renderer.toneMappingExposure = atmo.exposure;

        warmLights.forEach(l => {
          l.intensity = atmo.lanternIntensity;
        });

        if (particleSystems.stars) {
          particleSystems.stars.material.opacity = atmo.starOpacity;
        }
        if (particleSystems.rain) {
          particleSystems.rain.material.opacity = atmo.rainActive ? 0.75 : 0.0;
        }
      } else {
        const currentParams = {
          sunIntensity: mainDirLight.intensity,
          hemiIntensity: hemiLight.intensity,
          ambientIntensity: ambientLight.intensity,
          fogDensity: scene.fog.density,
          exposure: renderer.toneMappingExposure,
          lanternIntensity: warmLights[0] ? warmLights[0].intensity : 2.0,
          starOpacity: particleSystems.stars ? particleSystems.stars.material.opacity : 0.0,
          rainOpacity: particleSystems.rain ? particleSystems.rain.material.opacity : 0.0
        };

        const targetParams = {
          sunIntensity: atmo.sunIntensity,
          hemiIntensity: atmo.hemiIntensity,
          ambientIntensity: atmo.ambientIntensity,
          fogDensity: atmo.fogDensity,
          exposure: atmo.exposure,
          lanternIntensity: atmo.lanternIntensity,
          starOpacity: atmo.starOpacity,
          rainOpacity: atmo.rainActive ? 0.75 : 0.0
        };

        new TWEEN.Tween(currentParams)
          .to(targetParams, 1400)
          .easing(TWEEN.Easing.Cubic.Out)
          .onUpdate(() => {
            mainDirLight.intensity = currentParams.sunIntensity;
            hemiLight.intensity = currentParams.hemiIntensity;
            ambientLight.intensity = currentParams.ambientIntensity;
            scene.fog.density = currentParams.fogDensity;
            renderer.toneMappingExposure = currentParams.exposure;

            warmLights.forEach(l => {
              l.intensity = currentParams.lanternIntensity;
            });

            if (particleSystems.stars) {
              particleSystems.stars.material.opacity = currentParams.starOpacity;
            }
            if (particleSystems.rain) {
              particleSystems.rain.material.opacity = currentParams.rainOpacity;
            }
          })
          .start();

        const startFogColor = scene.fog.color.clone();
        const endFogColor = new THREE.Color(atmo.fogColor);
        const startSunColor = mainDirLight.color.clone();
        const endSunColor = new THREE.Color(atmo.sunColor);

        new TWEEN.Tween({ t: 0 })
          .to({ t: 1 }, 1400)
          .easing(TWEEN.Easing.Cubic.Out)
          .onUpdate(obj => {
            scene.fog.color.lerpColors(startFogColor, endFogColor, obj.t);
            mainDirLight.color.lerpColors(startSunColor, endSunColor, obj.t);
          })
          .start();

        updateSkyGradient(atmo.skyTop, atmo.skyMid, atmo.skyBottom);
      }
    }

    /* ========================================================
     * Camera View Transitions & Orbit Control
     * ======================================================== */
    function switchCameraView(viewKey, animate = true) {
      const preset = CAMERA_PRESETS[viewKey];
      if (!preset) return;
      CONFIG.currentView = viewKey;

      document.querySelectorAll('#views-group .btn').forEach(b => {
        b.classList.toggle('active', b.dataset.view === viewKey);
      });

      if (!animate) {
        camera.position.copy(preset.pos);
        controls.target.copy(preset.target);
        camera.fov = preset.fov;
        camera.updateProjectionMatrix();
        controls.update();
      } else {
        const startPos = camera.position.clone();
        const startTarget = controls.target.clone();
        const startFov = camera.fov;

        new TWEEN.Tween({ t: 0 })
          .to({ t: 1 }, 1600)
          .easing(TWEEN.Easing.Cubic.InOut)
          .onUpdate(obj => {
            camera.position.lerpVectors(startPos, preset.pos, obj.t);
            controls.target.lerpVectors(startTarget, preset.target, obj.t);
            camera.fov = THREE.MathUtils.lerp(startFov, preset.fov, obj.t);
            camera.updateProjectionMatrix();
            controls.update();
          })
          .start();

        const btnEl = document.querySelector(`[data-view="${viewKey}"]`);
        if (btnEl) showToast(`已切换至「${btnEl.innerText}」视角`);
      }
    }

    /* ========================================================
     * Procedural Web Audio Soundscape (Stream & Wind Chimes)
     * ======================================================== */
    let audioCtx = null;
    let waterGainNode = null;
    let chimeInterval = null;

    function initWebAudio() {
      if (audioCtx) return;
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();

        const bufferSize = audioCtx.sampleRate * 2;
        const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
        for (let i = 0; i < bufferSize; i++) {
          const white = Math.random() * 2 - 1;
          b0 = 0.99886 * b0 + white * 0.0555179;
          b1 = 0.99332 * b1 + white * 0.0750759;
          b2 = 0.96900 * b2 + white * 0.1538520;
          b3 = 0.86650 * b3 + white * 0.3104856;
          b4 = 0.55000 * b4 + white * 0.5329522;
          b5 = -0.7616 * b5 - white * 0.0168980;
          output[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.035;
          b6 = white * 0.115926;
        }

        const whiteNoiseSource = audioCtx.createBufferSource();
        whiteNoiseSource.buffer = noiseBuffer;
        whiteNoiseSource.loop = true;

        const streamFilter = audioCtx.createBiquadFilter();
        streamFilter.type = 'bandpass';
        streamFilter.frequency.setValueAtTime(620, audioCtx.currentTime);
        streamFilter.Q.setValueAtTime(1.8, audioCtx.currentTime);

        waterGainNode = audioCtx.createGain();
        waterGainNode.gain.setValueAtTime(0.0, audioCtx.currentTime);

        whiteNoiseSource.connect(streamFilter);
        streamFilter.connect(waterGainNode);
        waterGainNode.connect(audioCtx.destination);
        whiteNoiseSource.start(0);

        chimeInterval = setInterval(() => {
          if (!CONFIG.audioActive || !audioCtx) return;
          if (Math.random() > 0.45) {
            playBellTone();
          }
        }, 8000);

      } catch (e) {
        console.warn('Web Audio not supported:', e);
      }
    }

    function playBellTone() {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      const freqs = [1046.5, 1318.5, 1567.98, 2093.0];
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freqs[Math.floor(Math.random() * freqs.length)], now);

      gain.gain.setValueAtTime(0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 3.2);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 3.3);
    }

    function toggleAudio() {
      if (!audioCtx) {
        initWebAudio();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      CONFIG.audioActive = !CONFIG.audioActive;
      const iconOff = document.getElementById('sound-icon-off');
      const iconOn = document.getElementById('sound-icon-on');
      const btn = document.getElementById('btn-sound');

      if (CONFIG.audioActive) {
        iconOff.style.display = 'none';
        iconOn.style.display = 'block';
        btn.classList.add('active');
        if (waterGainNode) waterGainNode.gain.setTargetAtTime(0.35, audioCtx.currentTime, 0.4);
        playBellTone();
        showToast('环境白噪音已开启 (流水与风铃)');
      } else {
        iconOff.style.display = 'block';
        iconOn.style.display = 'none';
        btn.classList.remove('active');
        if (waterGainNode) waterGainNode.gain.setTargetAtTime(0.0, audioCtx.currentTime, 0.3);
        showToast('音效已静音');
      }
    }

    /* ========================================================
     * Quality, Screenshot & UI Toggles
     * ======================================================== */
    function toggleQuality() {
      CONFIG.highQuality = !CONFIG.highQuality;
      const btn = document.getElementById('btn-quality');
      btn.innerText = CONFIG.highQuality ? '画质: 高' : '画质: 轻';

      if (CONFIG.highQuality) {
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2.0));
        renderer.shadowMap.enabled = true;
        mainDirLight.castShadow = true;
        if (waterReflector) waterReflector.visible = true;
      } else {
        renderer.setPixelRatio(1.0);
        renderer.shadowMap.enabled = false;
        mainDirLight.castShadow = false;
        if (waterReflector) waterReflector.visible = false;
      }
      showToast(CONFIG.highQuality ? '已启用高精细画质模式' : '已切换为轻量流畅模式');
    }

    function captureScreenshot() {
      render();
      const dataURL = renderer.domElement.toDataURL('image/png');
      const a = document.createElement('a');
      a.download = `sakura_valley_${CONFIG.currentAtmo}_${Date.now()}.png`;
      a.href = dataURL;
      a.click();
      showToast('已截取当前画面并保存为 PNG 图片');
    }

    function toggleUI(show) {
      const uiLayer = document.getElementById('ui-layer');
      const showBtn = document.getElementById('btn-show-ui');
      if (show === undefined) {
        show = uiLayer.classList.contains('hidden');
      }

      if (show) {
        uiLayer.classList.remove('hidden');
        showBtn.style.display = 'none';
      } else {
        uiLayer.classList.add('hidden');
        showBtn.style.display = 'flex';
        showToast('界面已隐藏，按空格键或点击右下角恢复');
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toast-msg');
      if (!toast) return;
      toast.innerText = msg;
      toast.classList.add('show');
      clearTimeout(toast._timer);
      toast._timer = setTimeout(() => {
        toast.classList.remove('show');
      }, 2400);
    }

    /* ========================================================
     * Main Initialization & Render Loop
     * ======================================================== */
    function init() {
      const container = document.getElementById('webgl-container');

      scene = new THREE.Scene();

      const initialPreset = CAMERA_PRESETS[CONFIG.currentView] || CAMERA_PRESETS.panorama;
      camera = new THREE.PerspectiveCamera(initialPreset.fov, window.innerWidth / window.innerHeight, 0.5, 320);
      camera.position.copy(initialPreset.pos);

      renderer = new THREE.WebGLRenderer({
        antialias: true,
        powerPreference: 'high-performance',
        preserveDrawingBuffer: true
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2.0));
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.15;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.target.copy(initialPreset.target);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.maxPolarAngle = Math.PI / 2 - 0.03;
      controls.minDistance = 4.0;
      controls.maxDistance = 90.0;
      controls.update();

      setupSkyAndLighting();
      buildSakuraValley();
      setupWaterReflector();
      setupParticleSystems();

      bindUIEvents();
      window.addEventListener('resize', onWindowResize, false);

      document.querySelectorAll('#views-group .btn').forEach(b => {
        b.classList.toggle('active', b.dataset.view === CONFIG.currentView);
      });
      document.querySelectorAll('#atmos-group .btn').forEach(b => {
        b.classList.toggle('active', b.dataset.atmo === CONFIG.currentAtmo);
      });

      const loader = document.getElementById('loader');
      if (loader) {
        if (isTestMode) {
          loader.style.display = 'none';
        } else {
          setTimeout(() => {
            loader.classList.add('hidden');
          }, 300);
        }
      }

      animate();
    }

    function bindUIEvents() {
      document.querySelectorAll('#views-group .btn').forEach(btn => {
        btn.addEventListener('click', () => {
          switchCameraView(btn.dataset.view, true);
        });
      });

      document.querySelectorAll('#atmos-group .btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('#atmos-group .btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          applyAtmosphere(btn.dataset.atmo, true);
          showToast(`已切换至「${btn.innerText}」氛围`);
        });
      });

      document.getElementById('btn-reset').addEventListener('click', () => {
        switchCameraView(CONFIG.currentView, true);
      });

      const tourBtn = document.getElementById('btn-tour');
      tourBtn.addEventListener('click', () => {
        CONFIG.autoTour = !CONFIG.autoTour;
        tourBtn.classList.toggle('active', CONFIG.autoTour);
        showToast(CONFIG.autoTour ? '已开启缓动环视巡游' : '已停止巡游');
      });

      document.getElementById('btn-sound').addEventListener('click', toggleAudio);
      document.getElementById('btn-quality').addEventListener('click', toggleQuality);
      document.getElementById('btn-snapshot').addEventListener('click', captureScreenshot);
      document.getElementById('btn-hide-ui').addEventListener('click', () => toggleUI(false));
      document.getElementById('btn-show-ui').addEventListener('click', () => toggleUI(true));

      window.addEventListener('keydown', e => {
        if (e.code === 'Space') {
          e.preventDefault();
          toggleUI();
        }
      });
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);

      if (waterReflector && waterReflector.getRenderTarget) {
        const rt = waterReflector.getRenderTarget();
        if (rt) {
          rt.setSize(
            window.innerWidth * (window.devicePixelRatio || 1) * 0.75,
            window.innerHeight * (window.devicePixelRatio || 1) * 0.75
          );
        }
      }
    }

    function animate() {
      requestAnimationFrame(animate);

      const dt = clock.getDelta();
      TWEEN.update();

      if (CONFIG.autoTour) {
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.6;
      } else {
        controls.autoRotate = false;
      }

      controls.update();
      updateKoiFish(dt);
      updateWater(dt);
      updateParticles(dt);

      render();
    }

    function render() {
      renderer.render(scene, camera);
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
