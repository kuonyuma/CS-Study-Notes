<script>
    // 判断一个数字是否是正数

    let num = prompt("请输入一个数字");
    num = parseInt(num)
    if(num > 0){
        console.log("这是一个正数")
    }else if(num < 0){
        console.log("这是一个负数")
    }else{
        console.log("这是0")
    }
</script>
