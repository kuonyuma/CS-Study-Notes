spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/mybatisLearn?characterEncoding=utf8&useSSL=true
    username: root
    password: 123456789
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 打印SQL日志
    map-underscore-to-camel-case: true                     # 下划线转驼峰
  mapper-locations: classpath:mapper/**Mapper.xml          # XML文件扫描路径 ← 关键！
